services:
  gold-bot:
    build: .
    container_name: gold-fundamental-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
    ports:
      - "${WEBHOOK_PORT:-8080}:${WEBHOOK_PORT:-8080}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
